<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-label="topstepx-api — typed TopstepX client with autocomplete">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#0B1221"/>
      <stop offset="55%" stop-color="#111C35"/>
      <stop offset="100%" stop-color="#1B2A4E"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="38%" r="62%">
      <stop offset="0%"  stop-color="#22D3EE" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tsblue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#3178C6"/>
      <stop offset="100%" stop-color="#235A97"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="win">
      <rect x="60" y="56" width="1080" height="708" rx="16"/>
    </clipPath>
  </defs>

  <!-- Backdrop -->
  <rect width="1200" height="820" fill="url(#bg)"/>
  <rect width="1200" height="820" fill="url(#halo)"/>

  <!-- Editor window -->
  <rect x="60" y="56" width="1080" height="708" rx="16" fill="#0D1526" stroke="#263450" stroke-width="1.5" filter="url(#shadow)"/>

  <g clip-path="url(#win)" font-family="Menlo, Consolas, 'SF Mono', monospace">
    <!-- Title bar -->
    <rect x="60" y="56" width="1080" height="48" fill="#0A1120"/>
    <line x1="60" y1="104" x2="1140" y2="104" stroke="#1C2842" stroke-width="1"/>
    <circle cx="96"  cy="80" r="7" fill="#FF5F56"/>
    <circle cx="120" cy="80" r="7" fill="#FFBD2E"/>
    <circle cx="144" cy="80" r="7" fill="#27C93F"/>
    <rect x="208" y="68" width="32" height="24" rx="5" fill="url(#tsblue)"/>
    <text x="224" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">TS</text>
    <text x="252" y="86" font-size="20" fill="#C9D3E3">trade.ts</text>
    <text x="1116" y="86" text-anchor="end" font-size="18" fill="#4A5673">topstepx-api</text>

    <!-- Code -->
    <text x="100" y="158" font-size="26">
      <tspan fill="#6A9955">$ </tspan><tspan fill="#D4D4D4">npm install </tspan><tspan fill="#CE9178">topstepx-api</tspan>
    </text>
    <text x="100" y="196" font-size="19" fill="#6A9955" opacity="0.85">+ added topstepx-api@2.0.1</text>

    <text x="100" y="266" font-size="26">
      <tspan fill="#C586C0">import </tspan><tspan fill="#D4D4D4">{ </tspan><tspan fill="#4EC9B0">TopstepXClient</tspan><tspan fill="#D4D4D4"> } </tspan><tspan fill="#C586C0">from </tspan><tspan fill="#CE9178">'topstepx-api'</tspan>
    </text>

    <text x="100" y="326" font-size="26">
      <tspan fill="#569CD6">const </tspan><tspan fill="#9CDCFE">client </tspan><tspan fill="#D4D4D4">= </tspan><tspan fill="#569CD6">new </tspan><tspan fill="#4EC9B0">TopstepXClient</tspan><tspan fill="#D4D4D4">({ </tspan><tspan fill="#9CDCFE">username, apiKey </tspan><tspan fill="#D4D4D4">})</tspan>
    </text>

    <text x="100" y="392" font-size="26">
      <tspan fill="#C586C0">await </tspan><tspan fill="#9CDCFE">client</tspan><tspan fill="#D4D4D4">.</tspan>
    </text>
    <!-- caret -->
    <rect x="305" y="372" width="3" height="26" fill="#AEAFAD"/>

    <!-- IntelliSense autocomplete -->
    <rect x="300" y="408" width="520" height="322" rx="10" fill="#1F2336" stroke="#3A3F58" stroke-width="1.5"/>
    <!-- selected row -->
    <rect x="304" y="424" width="512" height="32" rx="4" fill="#163E63"/>

    <!-- rows: icon + name + type. Violet glyph = REST API, cyan glyph = live SignalR hub. -->
    <g font-size="22">
      <!-- accounts (selected) -->
      <rect x="318" y="430" width="18" height="18" rx="4" fill="#A78BFA" opacity="0.85"/>
      <rect x="322" y="437" width="10" height="2.6" rx="1.3" fill="#1F2336"/>
      <text x="348" y="446" fill="#9CDCFE">accounts</text>
      <text x="802" y="446" text-anchor="end" fill="#7E8AA6">AccountsApi</text>

      <!-- orders -->
      <rect x="318" y="466" width="18" height="18" rx="4" fill="#A78BFA" opacity="0.85"/>
      <rect x="322" y="473" width="10" height="2.6" rx="1.3" fill="#1F2336"/>
      <text x="348" y="482" fill="#9CDCFE">orders</text>
      <text x="802" y="482" text-anchor="end" fill="#6E7891">OrdersApi</text>

      <!-- positions -->
      <rect x="318" y="502" width="18" height="18" rx="4" fill="#A78BFA" opacity="0.85"/>
      <rect x="322" y="509" width="10" height="2.6" rx="1.3" fill="#1F2336"/>
      <text x="348" y="518" fill="#9CDCFE">positions</text>
      <text x="802" y="518" text-anchor="end" fill="#6E7891">PositionsApi</text>

      <!-- trades -->
      <rect x="318" y="538" width="18" height="18" rx="4" fill="#A78BFA" opacity="0.85"/>
      <rect x="322" y="545" width="10" height="2.6" rx="1.3" fill="#1F2336"/>
      <text x="348" y="554" fill="#9CDCFE">trades</text>
      <text x="802" y="554" text-anchor="end" fill="#6E7891">TradesApi</text>

      <!-- contracts -->
      <rect x="318" y="574" width="18" height="18" rx="4" fill="#A78BFA" opacity="0.85"/>
      <rect x="322" y="581" width="10" height="2.6" rx="1.3" fill="#1F2336"/>
      <text x="348" y="590" fill="#9CDCFE">contracts</text>
      <text x="802" y="590" text-anchor="end" fill="#6E7891">ContractsApi</text>

      <!-- history -->
      <rect x="318" y="610" width="18" height="18" rx="4" fill="#A78BFA" opacity="0.85"/>
      <rect x="322" y="617" width="10" height="2.6" rx="1.3" fill="#1F2336"/>
      <text x="348" y="626" fill="#9CDCFE">history</text>
      <text x="802" y="626" text-anchor="end" fill="#6E7891">HistoryApi</text>

      <!-- marketHub (live) -->
      <rect x="318" y="646" width="18" height="18" rx="4" fill="#22D3EE" opacity="0.9"/>
      <rect x="322" y="653" width="10" height="2.6" rx="1.3" fill="#0D1526"/>
      <text x="348" y="662" fill="#9CDCFE">marketHub</text>
      <text x="802" y="662" text-anchor="end" fill="#22D3EE">MarketHub</text>

      <!-- userHub (live) -->
      <rect x="318" y="682" width="18" height="18" rx="4" fill="#22D3EE" opacity="0.9"/>
      <rect x="322" y="689" width="10" height="2.6" rx="1.3" fill="#0D1526"/>
      <text x="348" y="698" fill="#9CDCFE">userHub</text>
      <text x="802" y="698" text-anchor="end" fill="#22D3EE">UserHub</text>
    </g>

    <!-- Signature / doc fly-out for the selected member -->
    <rect x="838" y="408" width="298" height="150" rx="9" fill="#171C2E" stroke="#2E3650" stroke-width="1.5"/>
    <text x="858" y="446" font-size="19">
      <tspan fill="#7E8AA6">(property) </tspan><tspan fill="#9CDCFE">accounts</tspan>
    </text>
    <text x="858" y="472" font-size="19">
      <tspan fill="#D4D4D4">: </tspan><tspan fill="#4EC9B0">AccountsApi</tspan>
    </text>
    <line x1="858" y1="490" x2="1116" y2="490" stroke="#2E3650" stroke-width="1"/>
    <text x="858" y="518" font-size="18" fill="#9AA3B8">Search and list active TopstepX</text>
    <text x="858" y="542" font-size="18" fill="#9AA3B8">trading accounts.</text>

    <!-- Status bar -->
    <rect x="60" y="730" width="1080" height="34" fill="#0B1A30"/>
    <line x1="60" y1="730" x2="1140" y2="730" stroke="#1C2842" stroke-width="1"/>
    <circle cx="92" cy="747" r="5" fill="#27C93F"/>
    <text x="106" y="753" font-size="16" fill="#9AA3B8">connected</text>
    <text x="1116" y="753" text-anchor="end" font-size="16" fill="#6E7C99">TypeScript · REST + SignalR WebSocket · ESM + CJS · v2.0.1</text>
  </g>
</svg>
